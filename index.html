<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบกรอกฟอร์ม IT Onboarding - Greyhound Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --ink:#1c1f26;
    --ink-soft:#5a6272;
    --paper:#f4f2ed;
    --card:#ffffff;
    --line:#e4e1d8;
    --accent:#b5482a;
    --accent-dark:#8f371f;
    --accent-soft:#f4e2da;
    --ok:#2f7d54;
    --focus:#b5482a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Thai',system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.5;
    padding-bottom:80px;
  }
  .topbar{
    background:var(--ink);
    color:#fff;
    padding:22px 24px 20px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute; right:-40px; top:-60px;
    width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle, rgba(181,72,42,.55), transparent 70%);
  }
  .topbar h1{
    margin:0; font-size:20px; font-weight:700; letter-spacing:.2px; position:relative;
  }
  .topbar p{
    margin:6px 0 0; font-size:13px; color:#c9ccd4; position:relative;
  }
  .wrap{max-width:880px;margin:0 auto;padding:20px 16px 0;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 20px 22px;
    margin-bottom:16px;
    box-shadow:0 1px 2px rgba(20,20,10,.04);
  }
  .card h2{
    font-size:15px; margin:0 0 4px;
    display:flex; align-items:center; gap:8px;
    color:var(--ink);
  }
  .card .step-no{
    width:22px;height:22px;border-radius:50%;
    background:var(--accent); color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:700; flex:none;
  }
  .card .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px 30px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
  .grid.g3{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:640px){ .grid, .grid.g3{grid-template-columns:1fr;} }
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  label .req{color:var(--accent);}
  label .opt{color:#9aa0ab;font-weight:400;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    font-family:inherit;
    font-size:14px;
    padding:9px 10px;
    border:1.5px solid var(--line);
    border-radius:7px;
    background:#fff;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--focus);}
  .hint{font-size:11.5px;color:#9aa0ab;}
  .readonly-box{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:9px 10px;
    border-radius:7px;
    background:#f7f5f0;
    border:1.5px dashed var(--line);
    color:var(--ink-soft);
    min-height:36px;
    display:flex;align-items:center;
    word-break:break-all;
  }
  .badge-auto{
    font-size:10.5px; background:var(--accent-soft); color:var(--accent-dark);
    padding:1px 7px; border-radius:20px; font-weight:600; margin-left:6px;
  }
  fieldset{border:none;padding:0;margin:0;}
  .warranty-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .warranty-links a{
    font-size:11.5px; text-decoration:none; color:var(--accent-dark);
    background:var(--accent-soft); padding:4px 9px; border-radius:20px;
    border:1px solid #eccfc2;
  }
  .warranty-links a:hover{background:#eccfc2;}
  .equip-row{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;margin-bottom:8px;}
  .equip-row .n{
    width:24px;height:24px;border-radius:6px;background:#eef1f4;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;
  }
  .toggle-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .toggle-row .chev{transition:transform .2s;color:var(--ink-soft);}
  .toggle-row.open .chev{transform:rotate(180deg);}
  .collapse-body{display:none;margin-top:14px;}
  .collapse-body.show{display:block;}
  .sig-wrap{
    border:1.5px dashed var(--line); border-radius:8px; background:#fdfdfb; position:relative;
    touch-action:none;
  }
  canvas#sigPad{width:100%;height:150px;display:block;border-radius:8px;cursor:crosshair;}
  .sig-tools{display:flex;gap:8px;margin-top:8px;}
  .btn-mini{
    font-size:12px; border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    padding:6px 12px; border-radius:7px; cursor:pointer;
  }
  .btn-mini:hover{border-color:#c7c2b6;}
  .footer-bar{
    position:fixed; left:0; right:0; bottom:0;
    background:#fff; border-top:1px solid var(--line);
    padding:12px 16px; display:flex; justify-content:center; gap:10px;
    box-shadow:0 -2px 10px rgba(0,0,0,.05);
    z-index:50;
  }
  .btn-primary{
    background:var(--accent); color:#fff; border:none;
    padding:12px 26px; border-radius:8px; font-size:14.5px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; gap:8px;
    box-shadow:0 2px 6px rgba(181,72,42,.35);
  }
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-primary:disabled{background:#c8c3b8;box-shadow:none;cursor:not-allowed;}
  .btn-secondary{
    background:#fff; color:var(--ink-soft); border:1.5px solid var(--line);
    padding:12px 20px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .status-msg{
    max-width:880px;margin:0 auto 8px;padding:0 16px;font-size:12.5px;color:var(--ink-soft);
    display:flex;align-items:center;gap:6px;min-height:18px;
  }
  .status-msg.err{color:#b5482a;font-weight:600;}
  .status-msg.ok{color:var(--ok);font-weight:600;}
  .required-flag{color:var(--accent);}
  .note-box{
    font-size:12px; background:#fbf7ee; border:1px solid #efe4c8; color:#7a6a35;
    border-radius:7px; padding:9px 11px; margin-top:6px;
  }
  .icon{width:15px;height:15px;flex:none;}
</style>
</head>

<div class="topbar">
  <h1>ระบบกรอกฟอร์ม IT Onboarding &amp; อุปกรณ์</h1>

<script>
/* ===================== helpers ===================== */
const $ = (sel, root=document) => root.querySelector(sel);
const el = (tag, attrs={}, ...children) => {
  const e = document.createElement(tag);
  for (const k in attrs){
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  children.forEach(c => { if (c!=null) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
};
const todayISO = () => new Date().toISOString().slice(0,10);
const b64ToArrayBuffer = (b64) => {
  const bin = atob(b64);
  const len = bin.length;
  const buf = new Uint8Array(len);
  for (let i=0;i<len;i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
};
const fmtWarrantyDate = (iso) => {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
};

/* ===================== field factory ===================== */
function field({id, label, type='text', options=null, placeholder='', required=false, full=false, opt=false, help=null, defaultVal=''}){
  const wrap = el('div', {class:'field' + (full?' full':'')});
  const lab = el('label', {}, label + (required?' ':''), required ? el('span',{class:'req'},'*') : (opt ? el('span',{class:'opt'},' (ไม่บังคับ)') : ''));
  wrap.append(lab);
  let input;
  if (type === 'select'){
    input = el('select', {id});
    input.append(el('option', {value:''}, '— เลือก —'));
    options.forEach(o => {
      const val = Array.isArray(o) ? o[0] : o;
      const text = Array.isArray(o) ? o[1] : o;
      input.append(el('option', {value:val}, text));
    });
  } else if (type === 'textarea'){
    input = el('textarea', {id, rows:2, placeholder});
  } else {
    input = el('input', {id, type, placeholder});
  }
  if (defaultVal) input.value = defaultVal;
  wrap.append(input);
  if (help) wrap.append(el('div', {class:'hint'}, help));
  return wrap;
}

function readonlyBox(id, placeholderText){
  const wrap = el('div', {class:'field'});
  wrap.append(el('label', {}, '', el('span',{}, '')));
  return wrap;
}

function card(stepNo, title, subtitle, bodyChildren){
  const c = el('div', {class:'card'});
  c.append(el('h2', {}, el('span',{class:'step-no'}, String(stepNo)), title));
  if (subtitle) c.append(el('p', {class:'sub'}, subtitle));
  const body = el('div', {});
  bodyChildren.forEach(x=>body.append(x));
  c.append(body);
  return c;
}

function collapseCard(stepNo, title, subtitle, bodyChildren, startOpen=false){
  const c = el('div', {class:'card'});
  const head = el('div', {class:'toggle-row' + (startOpen?' open':'')});
  head.append(el('h2', {style:'margin:0'}, el('span',{class:'step-no'}, String(stepNo)), title));
  head.append(el('svg', {class:'chev icon', viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', 'stroke-width':'2.2', html:'<path d="m6 9 6 6 6-6"/>'}));
  c.append(head);
  if (subtitle) c.append(el('p', {class:'sub'}, subtitle));
  const body = el('div', {class:'collapse-body' + (startOpen?' show':'')});
  bodyChildren.forEach(x=>body.append(x));
  c.append(body);
  head.addEventListener('click', () => {
    head.classList.toggle('open');
    body.classList.toggle('show');
  });
  return c;
}

  document.addEventListener('input', (e) => { if (e.target && e.target.id === id) updatePreviews(); });
  document.addEventListener('change', (e) => { if (e.target && e.target.id === id) updatePreviews(); });
});
updatePreviews();

/* ===================== signature pad ===================== */
let sigCtx, drawing = false, sigHasContent = false;
function setupSignaturePad(){
  const cvs = $('#sigPad');
  const ratio = window.devicePixelRatio || 1;
  const rect = cvs.getBoundingClientRect();
  cvs.width = rect.width * ratio;
  cvs.height = rect.height * ratio;
  sigCtx = cvs.getContext('2d');
  sigCtx.scale(ratio, ratio);
  sigCtx.lineWidth = 2.2;
  sigCtx.lineCap = 'round';
  sigCtx.strokeStyle = '#1c1f26';

  const pos = (e) => {
    const r = cvs.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  const start = (e) => { drawing = true; sigHasContent = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); e.preventDefault(); };
  const move = (e) => { if (!drawing) return; const p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); e.preventDefault(); };
  const end = () => { drawing = false; };

  cvs.addEventListener('mousedown', start);
  cvs.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  cvs.addEventListener('touchstart', start, {passive:false});
  cvs.addEventListener('touchmove', move, {passive:false});
  cvs.addEventListener('touchend', end);
}
setupSignaturePad();
btnClearSig.addEventListener('click', () => {
  const cvs = $('#sigPad');
  sigCtx.clearRect(0,0,cvs.width,cvs.height);
  sigHasContent = false;
});

/* ===================== validation ===================== */
function validate(){
  const required = [
    ['empId','รหัสพนักงาน (ตัวเลข)'],
    ['nameTh','ชื่อ-นามสกุล ผู้ใช้ (ภาษาไทย)'],
    ['nameEn','Name-Surname (English)'],
    ['company','Company'],
    ['department','Department'],
    ['auth','Authorization'],
    ['pwdDefault','Password เริ่มต้นเข้าเครื่อง'],
    ['compBrand','Computer Brand'],
    ['model','Model Computer'],
    ['serial','S/N , Service Tag'],
    ['assetCode','Code (Accounting Asset)'],
  ];
  const missing = [];
  for (const [id, label] of required){
    const v = $('#'+id).value;
    if (!v || !v.trim()) missing.push(label);
  }
  const nameEn = $('#nameEn').value.trim();
  if (nameEn && nameEn.split(/\s+/).length < 2) missing.push('Name-Surname (English) ต้องมีชื่อและนามสกุลคั่นด้วยวรรค');
  return missing;
}

/* ===================== export ===================== */
const statusMsg = $('#statusMsg');
function setStatus(text, kind){
  statusMsg.textContent = text;
  statusMsg.className = 'status-msg' + (kind ? ' '+kind : '');
}

async function copyStyleRow(ws, fromRow, toRow, cols){
  cols.forEach(c => {
    const src = ws.getCell(`${c}${fromRow}`);
    const dst = ws.getCell(`${c}${toRow}`);
    dst.style = JSON.parse(JSON.stringify(src.style));
  });
}

$('#btnExport').addEventListener('click', async () => {
  const missing = validate();
  if (missing.length){
    setStatus('กรุณากรอกข้อมูลให้ครบ: ' + missing.join(', '), 'err');
    return;
  }
  setStatus('กำลังสร้างไฟล์ Excel ...', '');
  $('#btnExport').disabled = true;
  try {
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(b64ToArrayBuffer(DATA.b64));

    const info = wb.getWorksheet('Info');

    const v = (id) => $('#'+id).value.trim();

    info.getCell('D3').value = v('empId') ? Number(v('empId')) || v('empId') : null;
    if (v('citizenId')) info.getCell('D5').value = v('citizenId');
    if (v('nickname')){ info.getCell('F6').value = v('nickname'); info.getCell('F7').value = v('nickname'); }
    info.getCell('D6').value = v('nameTh');
    info.getCell('D7').value = v('nameEn');
    info.getCell('D8').value = v('company');
    info.getCell('D9').value = v('department');
    info.getCell('D10').value = v('auth');
    info.getCell('D13').value = v('pwdDefault');

    // New field: Lotus Note ID (row 14 was blank in the original template)
    if (v('lotusId')){
      await copyStyleRow(info, 13, 14, ['B','C','D']);
      info.getCell('B14').value = 'Lotus Note ID';
      info.getCell('C14').value = ':';
      info.getCell('D14').value = v('lotusId');
    }

    if (v('lotusPwd')) info.getCell('D16').value = v('lotusPwd');
    if (v('webmailPwd')) info.getCell('D18').value = v('webmailPwd');

    info.getCell('D20').value = v('compBrand');
    info.getCell('D22').value = v('model');
    info.getCell('D23').value = v('serial');
    if (v('expressCode')) info.getCell('D24').value = v('expressCode');
    info.getCell('D25').value = v('assetCode');
    if (v('warrantyDate')) info.getCell('D26').value = fmtWarrantyDate(v('warrantyDate'));

    if (v('startDate')) info.getCell('D28').value = new Date(v('startDate') + 'T00:00:00');
    if (v('receiveDate')) info.getCell('D29').value = new Date(v('receiveDate') + 'T00:00:00');

    if (v('printer')) info.getCell('D31').value = Number(v('printer'));

    const deptIdx = (name) => DATA.dept.indexOf(name);
    if (v('transferFrom')) info.getCell('D37').value = DATA.deptTransfer[deptIdx(v('transferFrom'))] ?? v('transferFrom');
    if (v('transferTo')) info.getCell('D38').value = DATA.deptTransfer[deptIdx(v('transferTo'))] ?? v('transferTo');
    if (v('transferReason')){
      const ri = DATA.reason.indexOf(v('transferReason'));
      info.getCell('D39').value = DATA.reasonValues[ri] ?? v('transferReason');
    }

    for (let i=2;i<=6;i++){
      const val = v('equip'+i);
      if (val) info.getCell('D'+(42+i)).value = val;
    }

    // Signature -> Accept Regulation (New)
    if (sigHasContent){
      const cvs = $('#sigPad');
      const dataUrl = cvs.toDataURL('image/png');
      const imgId = wb.addImage({ base64: dataUrl, extension: 'png' });
      const arSheet = wb.getWorksheet('Accept Regulation (New)');
      if (arSheet){
        arSheet.addImage(imgId, { tl: { col: 0.2, row: 52.3 }, ext: { width: 170, height: 62 } });
      }
    }

    // Keep only the 4 requested sheets
    const keep = new Set(['Info', 'Accept Regulation (New)', 'โอนทรัพย์สิน F.', 'ยืม คืน']);
    [...wb.worksheets].forEach(ws => {
      if (!keep.has(ws.name)) wb.removeWorksheet(ws.id);
    });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const firstNameEn = v('nameEn').split(/\s+/)[0] || 'User';
    const a = document.createElement('a');
    a.href = url;
    a.download = `IT-_${firstNameEn}_GHC.xlsx`;
    document.body.append(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setStatus('สร้างไฟล์สำเร็จ ดาวน์โหลดเรียบร้อย', 'ok');
  } catch (err){
    console.error(err);
    setStatus('เกิดข้อผิดพลาด: ' + err.message, 'err');
  } finally {
    $('#btnExport').disabled = false;
  }
});

$('#btnReset').addEventListener('click', () => {
  document.querySelectorAll('input[type=text], input[type=number], textarea').forEach(i => i.value = '');
  document.querySelectorAll('select').forEach(s => s.value = '');
  $('#startDate').value = todayISO();
  $('#receiveDate').value = todayISO();
  $('#warrantyDate').value = '';
  const cvs = $('#sigPad'); sigCtx.clearRect(0,0,cvs.width,cvs.height); sigHasContent = false;
  updatePreviews();
  setStatus('');
});
